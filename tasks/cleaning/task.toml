schema_version = "1.1"
# Only these leave the agent's container. Grading happens in a fresh one, so nothing the agent
# changed outside them (a replaced tool, a process left running) can touch the score.
artifacts = [{ source = "/app", exclude = ["__pycache__", ".pytest_cache", ".ruff_cache"] }, "/report.md"]

[task]
name = "colincee/cleaning"
description = "Say what a small project no longer needs, with a working unused feature, a test that can overwrite real data and a test that asserts nothing."
authors = []
keywords = ["skills", "cleaning"]

[metadata]
difficulty = "medium"
category = "software-engineering"
tags = ["skills"]

[verifier]
timeout_sec = 300.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 1200.0
# While the agent works it can reach Anthropic and nothing else: not this repository's
# grading scripts on GitHub, and not anywhere a leaked sign-in could be sent.
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "*.anthropic.com", "claude.ai", "*.claude.ai"]

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
