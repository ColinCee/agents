schema_version = "1.1"
# Only these leave the agent's container. Grading happens in a fresh one, so nothing the agent
# changed outside them (a replaced tool, a process left running) can touch the score.
artifacts = [{ source = "/app", exclude = ["__pycache__", ".pytest_cache", ".ruff_cache"] }, "/report.md"]

[task]
name = "colincee/tidying"
description = "Tidy a small Python repository with planted faults and traps."
authors = []
keywords = ["skills", "tidying"]

[metadata]
difficulty = "medium"
category = "software-engineering"
tags = ["skills"]

[verifier]
timeout_sec = 300.0
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
